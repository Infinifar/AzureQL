name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后创建 GitHub Release 并附上签名 APK'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test
        run: ./gradlew :app:assembleDebug testDebugUnitTest lintDebug

      - name: Compile Compose UI tests
        run: ./gradlew :feature:backup:compileDebugAndroidTestKotlin

      - name: Report APK size
        shell: bash
        run: |
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name 'AzureQL-*-debug.apk' -print -quit)
          test -n "$apk"
          bytes=$(stat -c%s "$apk")
          mib=$(awk "BEGIN { printf \"%.2f\", $bytes / 1024 / 1024 }")
          echo "### Debug APK size" >> "$GITHUB_STEP_SUMMARY"
          echo "- $mib MiB ($bytes bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AzureQL-debug
          path: app/build/outputs/apk/debug/AzureQL-*-debug.apk

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify release signature
        shell: bash
        run: |
          latest_build_tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name 'AzureQL-*-release.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/$latest_build_tools/apksigner" verify --verbose --print-certs "$apk"

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: AzureQL v${{ steps.version.outputs.name }}
          draft: true
          prerelease: false
          files: app/build/outputs/apk/release/AzureQL-*-release.apk
          body: |
            AzureQL（Azure Dragon Panel）青龙面板 Android 客户端。

            支持 Android 12 及以上版本。发布前请补充完整变更说明并完成真机验收。
