name: Android CI

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后创建 GitHub Release 并附上 release APK'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug
        run: gradle :app:assembleDebug

      - name: Run tests
        run: gradle :app:testDebugUnitTest :feature:login:testDebugUnitTest

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "keystore decoded"
          else
            echo "no keystore secret, release falls back to debug signing"
          fi

      - name: Build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: AutoPanel v1.1.1
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            ## AutoPanel v1.1.1

            青龙面板 Android 客户端（Kotlin + Jetpack Compose + Material 3）。

            ### 本次更新
            - 脚本管理：文件夹可点击展开查看下一层级（目录树）
            - 脚本管理：修复子目录脚本内容加载（补传 path）
            - 脚本管理：大文件查看支持滚动，不再卡死 / 截断
            - 设置页：正确显示客户端 / 服务端版本与项目链接

            ### 安装
            下载下方 `app-release.apk` 直接安装（Android 7.0+，minSdk 24）。
