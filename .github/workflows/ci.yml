name: Android CI

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后创建 GitHub Release 并附上 release APK'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug
        run: gradle :app:assembleDebug

      - name: Run tests
        run: gradle :app:testDebugUnitTest :feature:login:testDebugUnitTest

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "keystore decoded"
          else
            echo "no keystore secret, release falls back to debug signing"
          fi

      - name: Build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: AutoPanel v1.1.0
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            ## AutoPanel v1.1.0

            青龙面板 Android 客户端（Kotlin + Jetpack Compose + Material 3）。

            ### 主要功能
            - 首页仪表盘：任务总览、系统状态、系统日志
            - 任务管理：批量运行 / 停止 / 启用 / 禁用 / 置顶 / 删除
            - 环境变量、脚本、依赖、订阅管理
            - 两步验证（TOTP）登录
            - mTLS 客户端证书支持（.p12/.pfx）
            - 设置页：客户端 / 服务端版本、项目链接、系统配置、登录日志、修改密码

            ### 安装
            下载下方 `app-release.apk` 直接安装（Android 7.0+，minSdk 24）。
