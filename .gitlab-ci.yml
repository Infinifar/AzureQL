stages:
  - verify
  - package

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  image:
    name: android-builder:api37
    pull_policy: if-not-present
  tags:
    - android
  interruptible: true
  before_script:
    - chmod +x ./gradlew

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1"

cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
      - gradle/libs.versions.toml
  paths:
    - .gradle/wrapper/
    - .gradle/caches/
  policy: pull-push

verify_debug:
  stage: verify
  script:
    - ./gradlew --version
    - ./gradlew :app:assembleDebug testDebugUnitTest lintDebug --max-workers=1 --console=plain --no-scan
    - ./gradlew :feature:backup:compileDebugAndroidTestKotlin :feature:log:compileDebugAndroidTestKotlin :feature:settings:compileDebugAndroidTestKotlin --max-workers=1 --console=plain --no-scan
    - apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name 'AzureQL-*-debug.apk' -print -quit)"; test -n "$apk"
  artifacts:
    name: "AzureQL-debug-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/debug/AzureQL-*-debug.apk
      - "**/build/reports/tests/"
      - "**/build/reports/lint-results-*.html"
    reports:
      junit:
        - "**/build/test-results/testDebugUnitTest/*.xml"

build_release:
  stage: package
  needs:
    - verify_debug
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: manual
  script:
    - |
      set -eu
      signing_mode=unsigned
      configured=0
      for value in "${KEYSTORE_BASE64:-}" "${KEYSTORE_PASSWORD:-}" "${KEY_ALIAS:-}" "${KEY_PASSWORD:-}"; do
        if [ -n "$value" ]; then configured=$((configured + 1)); fi
      done
      if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
        echo "Release signing variables are incomplete" >&2
        exit 1
      fi
      if [ "$configured" -eq 4 ]; then
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
        chmod 600 release.keystore
        signing_mode=signed
      fi
      printf 'SIGNING_MODE=%s\n' "$signing_mode" > release.env
      ./gradlew :app:assembleRelease --max-workers=1 --console=plain --no-scan
      apk="$(find app/build/outputs/apk/release -maxdepth 1 -name 'AzureQL-*-release*.apk' -print -quit)"
      test -n "$apk"
      printf 'RELEASE_APK=%s\n' "$apk" >> release.env
      if [ "$signing_mode" = signed ]; then
        apksigner verify --verbose --print-certs "$apk"
      else
        echo "Built unsigned Release test artifact; formal signed releases are published by GitHub Actions."
      fi
  artifacts:
    name: "AzureQL-release-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/release/AzureQL-*-release*.apk
    reports:
      dotenv: release.env
